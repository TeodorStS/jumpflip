# CS++ Flappy — production compose file.
#
#   docker compose up -d --build     start (or restart after a code change)
#   docker compose logs -f           follow logs (one line per game)
#   docker compose down              stop
#
# Then open /display for the stand screen, and /dev for every player with
# student numbers, the CSV export, deletion and a live monitor — /dev needs
# ADMIN_PASSWORD below.
#
# The database lives in a named volume, so `down`, rebuilds and image
# upgrades all leave the scores intact. Only `down -v` deletes it.

services:
  flappy:
    build: .
    image: cspp-flappy:latest
    container_name: cspp-flappy

    # Comes back after a reboot or a crash, but not if you stopped it
    # deliberately.
    restart: unless-stopped

    # Host:container. Override the host side without editing this file:
    #   FLAPPY_PORT=8080 docker compose up -d
    #
    # Once nginx is in front, change this to "127.0.0.1:3000:3000" so the
    # app is reachable only through the proxy and not directly from the
    # internet on port 3000.
    ports:
      - "${FLAPPY_PORT:-3000}:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      # Must match the mount below.
      DB_DIR: /data

      # Password for the /dev page (the username can be anything). Type it
      # between the quotes here on the server — don't commit it to GitHub.
      # Left empty, /dev is switched off. Use 12+ characters: it guards
      # every student number. A "$" in the password must be written "$$".
      ADMIN_PASSWORD: ""

    volumes:
      - flappy-data:/data

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3

    # A society game should never be able to take the whole box down.
    deploy:
      resources:
        limits:
          memory: 512M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  flappy-data:
    name: cspp-flappy-data
