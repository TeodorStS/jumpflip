# nginx reverse proxy for CS++ Flappy.
#
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/cspp-flappy
#   # edit server_name below
#   sudo ln -sf /etc/nginx/sites-available/cspp-flappy /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d flappy.yourdomain.com
#
# Certbot rewrites this file to add the TLS listener and a redirect, so
# start with plain http here and let it do that step.

server {
    listen 80;
    listen [::]:80;

    # CHANGE THIS to your domain.
    server_name flappy.yourdomain.com;

    # Scores are tiny JSON payloads; nothing here should be large.
    client_max_body_size 16k;

    # A stand can mean a burst of students submitting at once. Generous
    # enough not to block real play, tight enough to blunt a script.
    limit_req zone=cspp burst=40 nodelay;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Let phones cache static assets. Saves repeated downloads on a busy stand.
    # Safe across deploys: pages link their .js/.css as file.js?v=<hash> (see
    # sendPage in server.js), so a changed file gets an address that has never
    # been cached, and a new page is never paired with an old script.
    location ~* \.(js|css|png|svg|woff2?)$ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1h;
        add_header Cache-Control "public";
    }

    # The leaderboard must never be cached — a stale board on the display
    # screen is the one thing people notice immediately.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Cache-Control "no-store" always;
    }
}

# Put this in /etc/nginx/nginx.conf inside the http { } block, not here:
#
#   limit_req_zone $binary_remote_addr zone=cspp:10m rate=10r/s;
#
# Without that zone definition the limit_req line above will fail nginx -t.
